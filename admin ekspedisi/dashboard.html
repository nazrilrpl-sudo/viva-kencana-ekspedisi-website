<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Ekspedisi - Dashboard</title>

<link rel="icon" type="image/png" href="img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
<link rel="stylesheet" href="css/dashboard.css">

</head>
<body>

<svg width="0" height="0" style="position:absolute;overflow:hidden">
    <defs>
        <filter id="duotone-tersedia" color-interpolation-filters="sRGB">
            <feColorMatrix type="matrix" values="0.2126 0.7152 0.0722 0 0  0.2126 0.7152 0.0722 0 0  0.2126 0.7152 0.0722 0 0  0 0 0 1 0"/>
            <feComponentTransfer>
                <feFuncR type="table" tableValues="0.392 0.945"/>
                <feFuncG type="table" tableValues="0.455 0.961"/>
                <feFuncB type="table" tableValues="0.545 0.976"/>
            </feComponentTransfer>
        </filter>
        <filter id="duotone-siap" color-interpolation-filters="sRGB">
            <feColorMatrix type="matrix" values="0.2126 0.7152 0.0722 0 0  0.2126 0.7152 0.0722 0 0  0.2126 0.7152 0.0722 0 0  0 0 0 1 0"/>
            <feComponentTransfer>
                <feFuncR type="table" tableValues="0.082 0.733"/>
                <feFuncG type="table" tableValues="0.502 0.969"/>
                <feFuncB type="table" tableValues="0.239 0.816"/>
            </feComponentTransfer>
        </filter>
        <filter id="duotone-kirim" color-interpolation-filters="sRGB">
            <feColorMatrix type="matrix" values="0.2126 0.7152 0.0722 0 0  0.2126 0.7152 0.0722 0 0  0.2126 0.7152 0.0722 0 0  0 0 0 1 0"/>
            <feComponentTransfer>
                <feFuncR type="table" tableValues="0.114 0.749"/>
                <feFuncG type="table" tableValues="0.306 0.859"/>
                <feFuncB type="table" tableValues="0.847 0.996"/>
            </feComponentTransfer>
        </filter>
        <filter id="duotone-muat" color-interpolation-filters="sRGB">
            <feColorMatrix type="matrix" values="0.2126 0.7152 0.0722 0 0  0.2126 0.7152 0.0722 0 0  0.2126 0.7152 0.0722 0 0  0 0 0 1 0"/>
            <feComponentTransfer>
                <feFuncR type="table" tableValues="0.706 0.992"/>
                <feFuncG type="table" tableValues="0.325 0.902"/>
                <feFuncB type="table" tableValues="0.035 0.541"/>
            </feComponentTransfer>
        </filter>
        <filter id="duotone-blokir" color-interpolation-filters="sRGB">
            <feColorMatrix type="matrix" values="0.2126 0.7152 0.0722 0 0  0.2126 0.7152 0.0722 0 0  0.2126 0.7152 0.0722 0 0  0 0 0 1 0"/>
            <feComponentTransfer>
                <feFuncR type="table" tableValues="0.725 0.996"/>
                <feFuncG type="table" tableValues="0.110 0.792"/>
                <feFuncB type="table" tableValues="0.110 0.792"/>
            </feComponentTransfer>
        </filter>
    </defs>
</svg>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="brand">
            <img src="img/logo.png" alt="logo" class="brand-logo" onerror="this.style.display='none'">
            <span class="brand-name">Admin Ekspedisi</span>
        </div>

        <nav class="menu">
            <a href="#" class="menu-item active" data-page="dashboard">
                <i class="fa-solid fa-house"></i> <span>Dashboard</span>
            </a>
        </nav>

        <a href="index.html" class="logout">
            <i class="fa-solid fa-right-from-bracket"></i> <span>Logout</span>
        </a>
    </aside>

    <!-- MAIN -->
    <main class="main">

        <header class="topbar">
            <div class="welcome">
                <h1>Selamat datang<span class="wave"></span></h1>
            </div>
            <div class="top-actions">
            </div>
        </header>

        <!-- STAT CARDS -->
        <section class="stats" id="statCards"></section>

        <!-- SEARCH + FILTER -->
        <section class="toolbar">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Cari plat nomor, driver, atau tipe kendaraan...">
            </div>

            <div class="custom-select" id="filterStatus" data-value="">
                <button type="button" class="custom-select-trigger">
                    <span class="custom-select-label">Semua Status</span>
                    <i class="fa-solid fa-chevron-down"></i>
                </button>
                <div class="custom-select-options">
                    <div class="custom-select-option selected" data-value="">Semua Status</div>
                    <div class="custom-select-option" data-value="Tersedia">Tersedia</div>
                    <div class="custom-select-option" data-value="Siap">Siap</div>
                    <div class="custom-select-option" data-value="Kirim">Kirim</div>
                    <div class="custom-select-option" data-value="Muat">Muat</div>
                    <div class="custom-select-option" data-value="Blokir">Blokir</div>
                </div>
            </div>

            <div class="custom-select" id="filterTipe" data-value="">
                <button type="button" class="custom-select-trigger">
                    <span class="custom-select-label">Semua Tipe</span>
                    <i class="fa-solid fa-chevron-down"></i>
                </button>
                <div class="custom-select-options">
                    <div class="custom-select-option selected" data-value="">Semua Tipe</div>
                    <div class="custom-select-option" data-value="CDD">CDD</div>
                    <div class="custom-select-option" data-value="CDD LONG">CDD LONG</div>
                    <div class="custom-select-option" data-value="ENGKEL">ENGKEL</div>
                    <div class="custom-select-option" data-value="FUSO">FUSO</div>
                    <div class="custom-select-option" data-value="KONTAINER">KONTAINER</div>
                    <div class="custom-select-option" data-value="PICK UP">PICK UP</div>
                    <div class="custom-select-option" data-value="TRAILER PANJANG">TRAILER PANJANG</div>
                    <div class="custom-select-option" data-value="TRAILER PENDEK">TRAILER PENDEK</div>
                    <div class="custom-select-option" data-value="TRONTON">TRONTON</div>
                    <div class="custom-select-option" data-value="TRONTON PENDEK">TRONTON PENDEK</div>
                </div>
            </div>

        </section>

        <!-- LIST KENDARAAN -->
        <h2 class="section-title">List Kendaraan</h2>
        <section class="vehicle-grid" id="vehicleGrid"></section>

    </main>
</div>

<!-- MODAL INFORMASI / KONFIRMASI KENDARAAN -->
<div class="modal-overlay" id="detailModal">
    <div class="modal-box">
        <div class="modal-header">
            <h3>Informasi Kendaraan</h3>
            <button class="modal-close" id="modalClose"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="modal-body" id="modalBody"></div>
        <div class="confirm-actions" id="modalActions">
            <button class="btn-cancel" id="confirmCancel">Tidak</button>
            <button class="btn-confirm" id="confirmYes">Ya</button>
        </div>
    </div>
</div>

<script src="js/dashboard.js"></script>
</body>
</html>
